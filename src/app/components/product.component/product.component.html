<div class="product">
    <div class="img">
        <app-img [changeImage]="product.images[0]"></app-img>
    </div>
    <div class="information">
        <p class="name">{{product.title | reverse}}</p>
        <p class="description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Itaque ut iure vero iusto ullam nihil nemo commodi
            ad reprehenderit sequi magni non, reiciendis culpa quo recusandae iste illo, modi at.
        </p>
        <h2 class="price"> {{product.price | currency}}</h2>
    </div>
    <button (click)="onAddToCart()">Add to card</button>

</div>
