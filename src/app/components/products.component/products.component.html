<p appHighlight>
    Today {{today | date : 'medium'}}
</p>
<p>
    From {{ date | date:'medium' }} to today it has been: {{ date | timeAgo }}
</p>
<p *ngIf="loading">Cargando productos...</p>

<p *ngIf="!loading && products.length === 0">
    No hay productos
</p>

<div class="products--grid" *ngIf="!loading && products.length > 0">
    <app-product *ngFor="let product of products" [product]="product" (addedProduct)="onAddToShoppingCart($event)">
    </app-product>
</div>
