<p appHighlight>
  Today {{ today | date:'medium' }}
</p>

<p>
  From {{ date | date:'medium' }} to today it has been:
  {{ date | timeAgo }}
</p>

@if (loading) {
  <!-- LOADING -->
  <div class="loading">
    <p>Loading...</p>
    <div class="loading-bar" [style.width.%]="barPorcent"></div>
  </div>
} @else {

  @if (products.length === 0) {
    <!-- EMPTY -->
    <p>Empty products</p>
  } @else {
    <!-- LIST -->
    <div class="products--grid">
      @for (product of products; track product.id) {
        <app-product
          [product]="product"
          (addedProduct)="onAddToShoppingCart($event)">
        </app-product>
      }
    </div>
  }

}
